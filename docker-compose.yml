version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - habits_network

  redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - habits_network

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - static_volume:/app/static_collected
      - media_volume:/app/media
      - logs_volume:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings_prod
      - DEBUG=False
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - habits_network

  celery:
    build: .
    command: celery -A config worker --loglevel=info
    volumes:
      - logs_volume:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings_prod
      - DEBUG=False
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - habits_network

  celery-beat:
    build: .
    command: celery -A config beat --loglevel=info
    volumes:
      - logs_volume:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings_prod
      - DEBUG=False
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - habits_network

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - habits_network

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:

networks:
  habits_network:
    driver: bridge